# Baut die Installer für Windows (.msi) und macOS (.dmg).
# - manuell: GitHub → Actions → "Installer bauen" → Run workflow
# - automatisch bei einem Versions-Tag (git tag v1.0.0 && git push --tags):
#   dann zusätzlich als GitHub-Release mit allen Dateien.
# Die Linux-Flatpak entsteht lokal mit packaging/flatpak/build.sh.
name: Installer bauen

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  PYQT: "6.11.0"
  PYINSTALLER: "6.22.3"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install "PyQt6==$env:PYQT" "PyQt6-WebEngine==$env:PYQT" "pyinstaller==$env:PYINSTALLER"
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' mattpad.py)" >> "$GITHUB_OUTPUT"
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/mattpad.spec
      - name: MSI bauen (en, de, es, pt → ein mehrsprachiges MSI)
        shell: pwsh
        run: |
          pip install pywin32
          $v = "${{ steps.v.outputs.version }}"
          # ProductCode must change with every version, but be the same in all languages
          $pc = python -c "import uuid; print(str(uuid.uuid5(uuid.NAMESPACE_URL, 'mattpad/$v')).upper())"
          $langs = @{ "en-US" = 1033; "de-DE" = 1031; "es-ES" = 3082; "pt-BR" = 1046 }
          foreach ($c in $langs.Keys) {
            wix build packaging\windows\mattpad.wxs -ext WixToolset.UI.wixext -culture $c `
              -loc packaging\windows\mattpad.$c.wxl -d Lang=$($langs[$c]) `
              -d Version=$v -d "ProductCode={$pc}" -d "DistDir=$PWD\dist\MattPad" -o "msi-$c.msi"
            if ($LASTEXITCODE -ne 0) { throw "wix build $c failed" }
          }
          $size = (Get-Item msi-en-US.msi).Length
          if ($size -lt 50MB) { throw "MSI is only $size bytes - program files were not harvested" }
          Copy-Item msi-en-US.msi "MattPad-Windows.msi"
          python packaging\windows\embed_languages.py "MattPad-Windows.msi" `
            1031=msi-de-DE.msi 3082=msi-es-ES.msi 1046=msi-pt-BR.msi
          if ($LASTEXITCODE -ne 0) { throw "embed_languages failed" }
      - name: Test – MSI installieren und Programm starten
        shell: pwsh
        run: |
          $msi = "MattPad-Windows.msi"
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "msiexec exit $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\MattPad\MattPad.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 30 FullName
            Select-String -Path install.log -Pattern "INSTALLFOLDER|ALLUSERS|MattPad.exe" | Select-Object -First 15
            throw "MattPad.exe nicht installiert" }
          Start-Process $exe
          Start-Sleep -Seconds 30
          if (-not (Get-Process MattPad -ErrorAction SilentlyContinue)) { throw "MattPad läuft nicht" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot-windows.png")
          Stop-Process -Name MattPad -Force
          $u = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Deinstallation exit $($u.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: |
            MattPad-*.msi
            screenshot-windows.png
            install.log

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1–M4)
            arch: AppleSilicon
          - runner: macos-15-intel    # ältere Macs mit Intel-Prozessor
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install "PyQt6==$PYQT" "PyQt6-WebEngine==$PYQT" "pyinstaller==$PYINSTALLER"
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' mattpad.py)" >> "$GITHUB_OUTPUT"
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/mattpad.spec
      - name: Test – Programm starten
        run: |
          dist/MattPad.app/Contents/MacOS/MattPad > app.log 2>&1 &
          sleep 30
          pgrep -f MattPad.app/Contents/MacOS/MattPad || { cat app.log; exit 1; }
          screencapture -x screenshot-macos-${{ matrix.arch }}.png || true
          pkill -f MattPad.app/Contents/MacOS/MattPad || true
      - name: DMG bauen
        run: |
          mkdir dmg
          cp -R dist/MattPad.app dmg/
          ln -s /Applications dmg/Applications
          cp packaging/LEEME-README.txt dmg/
          cp LICENSE dmg/LICENSE.txt
          # hdiutil sometimes fails with "Resource busy" on CI runners – retry
          for i in 1 2 3 4 5; do
            hdiutil create -volname "Matt|Pad" -srcfolder dmg -ov -format UDZO \
              "MattPad-macOS-${{ matrix.arch }}.dmg" && break
            echo "hdiutil failed (attempt $i), retrying"; sleep 15
            [ $i = 5 ] && exit 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            MattPad-*.dmg
            screenshot-macos-*.png
            app.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            MattPad-*.msi
            MattPad-*.dmg
            packaging/LEEME-README.txt
